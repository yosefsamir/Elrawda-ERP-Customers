name: Build Windows x64 Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    name: Build Self-Contained Windows Installer
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install Inno Setup 6 Compiler
        shell: powershell
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $isccPath) {
            Write-Host "Adding $isccPath to GITHUB_PATH"
            "$isccPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: PowerShell Syntax Gate (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/powershell-parse-check.ps1

      - name: Fast Inno Setup Compiler Validation (Stub Payload)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/iscc-stub-check.ps1

      - name: Install dependencies (compile Windows x64 better-sqlite3)
        run: npm ci

      - name: Build TypeScript backend and Vite web frontend
        run: npm run build

      - name: Run test suite
        run: npm run test:core

      - name: Verify real Chromium session lifecycle with offline fixtures
        run: npm run test:whatsapp:browser

      - name: Package self-contained Windows release payload
        shell: powershell
        run: |
          $env:BUNDLE_RUNTIME = '1'
          node scripts/release.mjs --bundle-runtime

      - name: Verify packaged runtime preflight
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $releaseDir = "release\whatsapp-erp-windows-$($pkg.version)"
          $env:ELRAWDA_RELEASE_DIR = (Resolve-Path $releaseDir).Path
          node tests/release-smoke.mjs

      - name: Compile Windows Setup Installer (.exe)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/build-installer.ps1 -ReusePayload

      - name: Generate Build Summary
        shell: powershell
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $setupExe = "release\WhatsAppERP-Setup-$version.exe"
          $hashFile = "$setupExe.sha256"
          
          if (-not (Test-Path $setupExe)) {
            throw "Installer binary not found: $setupExe"
          }
          
          $item = Get-Item $setupExe
          $hash = (Get-FileHash -LiteralPath $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sizeMB = [math]::Round($item.Length / 1MB, 2)
          
          $iscc = (Get-Item "C:\Program Files (x86)\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion
          $summary = @(
            '# WhatsApp-ERP Windows Installer Build Summary',
            '',
            "- **Version:** $version",
            "- **File:** $($item.Name)",
            "- **File Size:** $sizeMB MB ($($item.Length) bytes)",
            ('- **SHA-256 Checksum:** `{0}`' -f $hash),
            "- **Inno Setup:** $iscc",
            "- **Commit:** $env:GITHUB_SHA",
            '',
            'Install, upgrade and uninstall results are in the windows-installer-test-results artifact.'
          ) -join "`n"

          $summary | Out-File -FilePath "release\BUILD-SUMMARY.md" -Encoding utf8
          Write-Host $summary

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WhatsAppERP-Windows-Setup-${{ github.sha }}
          path: |
            release/WhatsAppERP-Setup-*.exe
            release/WhatsAppERP-Setup-*.exe.sha256
            release/BUILD-SUMMARY.md
          if-no-files-found: error
          retention-days: 14

  test-windows-installer:
    name: Test Windows Setup.exe Integration
    runs-on: windows-2022
    needs: build-windows-installer
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Installer Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhatsAppERP-Windows-Setup-${{ github.sha }}
          path: release

      - name: Run Windows Installer Integration Tests
        shell: powershell
        run: |
          $setupExe = (Get-Item release\WhatsAppERP-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Discovered Installer: $setupExe"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/installer-integration.test.ps1 -SetupExePath "$setupExe"

      - name: Upload Test Logs and Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-test-logs-${{ github.sha }}
          path: release/logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-test-results-${{ github.sha }}
          path: release/test-summary.json
          if-no-files-found: ignore
          retention-days: 14

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-windows-installer, test-windows-installer ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Installer Artifacts
        uses: actions/download-artifact@v8
        with:
          name: WhatsAppERP-Windows-Setup-${{ github.sha }}
          path: release

      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          name: windows-installer-test-results-${{ github.sha }}
          path: release

      - name: Verify Test Integrity (Zero Test Failures Required)
        run: |
          if [ ! -f "release/test-summary.json" ]; then
            echo "::error::release/test-summary.json not found! Cannot verify test integrity before release."
            exit 1
          fi
          FAILED_COUNT=$(jq '.Failed' release/test-summary.json)
          TOTAL_COUNT=$(jq '.Total' release/test-summary.json)
          PASSED_COUNT=$(jq '.Passed' release/test-summary.json)
          echo "Integration Test Summary: $PASSED_COUNT passed, $FAILED_COUNT failed out of $TOTAL_COUNT"
          if [ "$FAILED_COUNT" -ne 0 ]; then
            echo "::error::Cannot publish release: $FAILED_COUNT integration test(s) failed."
            echo "All tests must pass without exception before releasing customer-ready builds."
            jq '.Failures' release/test-summary.json
            exit 1
          fi

      - name: Publish Release to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Target Release Tag: $TAG"

          # 1. Prevent overwriting an existing published release accidentally
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release for tag '$TAG' already exists! Overwriting published releases is forbidden to prevent data loss."
            exit 1
          fi

          # 2. Determine if pre-release (-rc, -beta, -alpha)
          EXTRA_FLAGS=""
          if [[ "$TAG" =~ -(rc|beta|alpha) ]]; then
            echo "Tagged as pre-release ($TAG)"
            EXTRA_FLAGS="--prerelease"
          fi

          # 3. Locate assets
          SETUP_EXE=$(ls release/WhatsAppERP-Setup-*.exe 2>/dev/null | head -n 1)
          SHA_FILE=$(ls release/WhatsAppERP-Setup-*.exe.sha256 2>/dev/null | head -n 1)

          if [ -z "$SETUP_EXE" ] || [ ! -f "$SETUP_EXE" ]; then
            echo "::error::Setup installer executable missing in release directory!"
            exit 1
          fi
          if [ -z "$SHA_FILE" ] || [ ! -f "$SHA_FILE" ]; then
            echo "::error::SHA256 checksum file missing in release directory!"
            exit 1
          fi

          NOTES_ARG="--generate-notes"
          if [ -f "release/BUILD-SUMMARY.md" ]; then
            NOTES_ARG="--notes-file release/BUILD-SUMMARY.md"
          fi

          echo "Publishing assets to GitHub Release '$TAG':"
          echo "  - Asset: $SETUP_EXE"
          echo "  - Asset: $SHA_FILE"

          gh release create "$TAG" \
            "$SETUP_EXE" \
            "$SHA_FILE" \
            --title "WhatsApp-ERP Windows $TAG" \
            $NOTES_ARG \
            $EXTRA_FLAGS

